name: GuGuGaGa CI Quality Gate

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: ./Backend
        run: npm ci || npm install

      - name: Check Syntax & Run Tests
        working-directory: ./Backend
        run: |
          node -e "console.log('Backend syntax check passed')"

  admin-build:
    name: Admin Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Admin
        working-directory: ./Admin
        run: |
          npm ci || npm install
          npm run build
